<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Reference Atlas · Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#1D3A30; --teal:#2E7A76; --sage:#8CA794; --amber:#E2AA3B; --timber:#6A4125;
  --mist:#EEF3F1; --stone:#6B7280; --brick:#B5472E; --slate:#3C6E9E;
  --paper:#F7F9F8; --line:#D9E2DE; --line2:#C5D2CC; --white:#fff;
  --serif:'Inter Tight', 'Manrope', system-ui, sans-serif; --sans:'Manrope', system-ui, sans-serif; --mono:'JetBrains Mono', ui-monospace, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--forest);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
::selection{background:var(--amber);color:var(--forest)}

.top{position:sticky;top:0;z-index:30;background:var(--forest);color:var(--mist)}
.top-inner{display:flex;align-items:center;gap:18px;padding:14px 28px;max-width:1800px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.brand h1{font-family:var(--serif);font-weight:600;letter-spacing:-.02em;font-size:24px;margin:0}
.brand h1 em{color:var(--amber);font-weight:500}
.brand small{font-family:var(--mono);font-size:10.5px;color:var(--sage);letter-spacing:.12em;text-transform:uppercase}
.search{flex:1;max-width:760px;display:flex;align-items:center;gap:0;background:rgba(238,243,241,.08);border:1px solid rgba(140,167,148,.35);border-radius:999px;transition:.2s;padding:4px 4px 4px 0}
.search:focus-within{background:rgba(238,243,241,.14);border-color:var(--amber)}
.search svg.mag{margin:0 10px 0 16px;opacity:.6;flex-shrink:0}
.search input{flex:1;min-width:0;background:none;border:0;padding:8px 6px;color:var(--mist);outline:none}
.search input::placeholder{color:rgba(238,243,241,.5)}
.mode{display:flex;background:rgba(0,0,0,.22);border-radius:999px;padding:3px;flex-shrink:0}
.mode button{border:0;background:none;color:rgba(238,243,241,.75);padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;display:flex;gap:6px;align-items:center}
.mode button.on{background:var(--mist);color:var(--forest)}
.mode button.on.ai{background:var(--amber);color:var(--forest)}
.topbtn{border:0;background:rgba(0,0,0,.2);color:var(--mist);padding:9px 15px;border-radius:999px;font-weight:600;font-size:13px;display:flex;gap:7px;align-items:center;white-space:nowrap}
.topbtn.on{background:var(--mist);color:var(--forest)}
.topbtn .count{font-family:var(--mono);font-size:10.5px;background:var(--amber);color:var(--forest);border-radius:999px;padding:1px 7px}
.iconbtn{border:0;background:rgba(0,0,0,.2);color:var(--mist);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}

.wrap{max-width:1800px;margin:0 auto;display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 66px)}
aside{border-right:1px solid var(--line);padding:22px 22px 60px;position:sticky;top:66px;height:calc(100vh - 66px);overflow:auto}
aside::-webkit-scrollbar{width:6px}aside::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
main{padding:24px 30px 80px;min-width:0}
.fgroup{margin-bottom:22px}
.flabel{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);margin-bottom:10px}
.flabel button{border:0;background:none;color:var(--teal);font-family:var(--mono);font-size:10.5px;padding:0;text-transform:none;letter-spacing:.04em}
.flabel .ad{font-family:var(--mono);font-size:9px;letter-spacing:.06em;background:var(--mist);border-radius:4px;padding:1px 5px;text-transform:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:var(--white);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:500;transition:.12s;line-height:1.2}
.chip:hover{border-color:var(--teal)}
.chip.on{background:var(--forest);border-color:var(--forest);color:var(--mist)}
.srcs{display:flex;flex-direction:column;gap:4px}
.srow{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:10px;border:1px solid transparent;cursor:pointer;user-select:none;transition:.12s}
.srow:hover{background:var(--white);border-color:var(--line)}
.srow .bx{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line2);display:grid;place-items:center;flex-shrink:0;background:#fff}
.srow.on .bx{background:var(--c);border-color:var(--c)}
.srow.on .bx::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.srow b{font-weight:600;font-size:13px;flex:1}
.srow small{font-family:var(--mono);font-size:10.5px;color:var(--stone)}
.srow .sp{width:12px;height:12px;border:2px solid var(--line2);border-top-color:var(--teal);border-radius:50%;animation:sp .8s linear infinite}
.sel{width:100%;border:1px solid var(--line2);border-radius:10px;padding:9px 10px;background:var(--white);font-size:13px;outline:none}
.sel:focus{border-color:var(--teal)}
.range{display:flex;gap:8px;align-items:center}
.range input{width:100%;border:1px solid var(--line2);border-radius:10px;padding:8px 10px;background:var(--white);font-family:var(--mono);font-size:12px;outline:none}
.range input:focus{border-color:var(--teal)}
.buckets{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}
.buckets button{border:1px solid var(--line2);background:var(--white);border-radius:8px;padding:6px 4px;font-family:var(--mono);font-size:10.5px}
.buckets button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.note{font-size:12px;color:var(--stone);line-height:1.55;background:var(--mist);border-radius:10px;padding:10px 12px}
.reset{width:100%;border:1px dashed var(--line2);background:none;border-radius:12px;padding:10px;color:var(--stone);font-weight:600}
.reset:hover{border-color:var(--brick);color:var(--brick)}

.mh{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:16px;flex-wrap:wrap}
.mh h2{font-family:var(--serif);font-weight:600;letter-spacing:-.02em;font-size:34px;line-height:1;margin:0}
.mh h2 i{color:var(--teal)}
.mh p{margin:6px 0 0;color:var(--stone)}
.tools{display:flex;gap:8px;align-items:center}
.seg2{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--white)}
.seg2 button{border:0;background:none;padding:7px 11px;font-family:var(--mono);font-size:11px;color:var(--stone)}
.seg2 button.on{background:var(--mist);color:var(--forest)}
.active-f{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 18px}
.af{background:var(--mist);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 11px;font-size:12px;display:flex;gap:6px;align-items:center}
.af button{border:0;background:var(--white);border-radius:50%;width:18px;height:18px;line-height:16px;padding:0;color:var(--stone)}

/* AI banner */
.aib{background:linear-gradient(120deg,#fff 0%,#FBF4E4 100%);border:1px solid #EBD9B0;border-radius:16px;padding:18px 20px;margin-bottom:22px}
.aib .h{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--timber)}
.aib p{margin:8px 0 12px;font-size:14.5px;line-height:1.55}
.aib .pre{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:12px}
.pcard{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:.15s;min-height:74px}
.pcard:hover{border-color:var(--amber)}
.pcard .t{width:84px;flex-shrink:0;background:var(--mist);position:relative}
.pcard .t img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pcard .b{padding:8px 10px 8px 0;display:flex;flex-direction:column;gap:2px;min-width:0}
.pcard b{font-family:var(--serif);font-weight:600;letter-spacing:-.02em;font-size:13px;line-height:1.1}
.pcard small{font-size:11.5px;color:var(--stone);line-height:1.35}
.aithink{display:flex;gap:10px;align-items:center;color:var(--timber)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw,320px),1fr));gap:22px}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:transform .18s, box-shadow .18s;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:0 16px 34px -20px rgba(29,58,48,.5)}
.ph{position:relative;aspect-ratio:4/3;background:var(--mist);overflow:hidden;cursor:zoom-in}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s, transform .6s}
.card:hover .ph img.cur{transform:scale(1.03)}
.ph .dots{position:absolute;left:0;right:0;bottom:10px;display:flex;gap:5px;justify-content:center;opacity:0;transition:.2s}
.card:hover .dots{opacity:1}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55)}
.dots i.on{background:#fff}
.ph .zones{position:absolute;inset:0;display:flex}
.ph .zones span{flex:1}
.badge{position:absolute;left:12px;top:12px;font-family:var(--mono);font-size:10.5px;background:rgba(255,255,255,.9);padding:3px 8px;border-radius:6px}
.src{position:absolute;left:12px;bottom:12px;font-family:var(--mono);font-size:10px;color:#fff;padding:3px 8px;border-radius:6px;display:flex;gap:5px;align-items:center}
.save{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;z-index:3;transition:.15s}
.save:hover{transform:scale(1.08)}
.save.on{background:var(--amber)}
.cb{padding:13px 16px 15px;display:flex;flex-direction:column;gap:5px;flex:1}
.cat{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.card h3{font-family:var(--serif);font-weight:600;letter-spacing:-.02em;font-size:18px;line-height:1.12;margin:0}
.card h3 a{text-decoration:none}
.card h3 a:hover{color:var(--teal)}
.by{color:var(--stone);font-size:13px}
.meta{display:flex;gap:12px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;flex-wrap:wrap}
.meta em{font-style:normal;color:var(--stone)}
.credit{font-size:11px;color:var(--stone)}
.ph img.dw,.lb .stage img.dw{object-fit:contain;background:#fff}
.ph img.dw{padding:6px}
.dwtag{position:absolute;right:12px;bottom:12px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;background:#fff;color:var(--forest);border:1px solid var(--line2);padding:2px 7px;border-radius:5px;opacity:0;transition:.2s}
.dwtag.on{opacity:1}
.lb .gal{grid-column:1;overflow:auto;padding:0 34px 40px;min-width:0;position:relative}
.lb .ghead{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:14px;padding:16px 60px 16px 0;margin-bottom:6px;background:linear-gradient(rgba(14,26,22,.98) 70%,rgba(14,26,22,0))}
.lb .ghead .gtitle{font-family:var(--serif);font-weight:600;font-size:17px;color:var(--mist);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.lb .ghead .lbtabs{position:static;transform:none}
.lb .ghead .gsize{position:static}
.lb .gal .cols{columns:var(--gc,3) 300px;column-gap:14px}
.lb .gal .gi{break-inside:avoid;margin:0 0 14px;border-radius:10px;overflow:hidden;cursor:zoom-in;position:relative;background:rgba(238,243,241,.06);transition:transform .2s, box-shadow .2s}
.lb .gal .gi:hover{transform:translateY(-2px);box-shadow:0 18px 40px -18px rgba(0,0,0,.7)}
.lb .gal .gi img{width:100%;display:block;min-height:120px}
.lb .gal .gi.dw{background:#fff}.lb .gal .gi.dw img{padding:10px}
.lb .gal .gi .k{position:absolute;left:10px;bottom:10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;background:rgba(29,58,48,.85);color:var(--mist);padding:2px 7px;border-radius:5px;opacity:0;transition:.2s}
.lb .gal .gi:hover .k,.lb .gal .gi.dw .k{opacity:1}
.lb .gal .gi.dw .k{background:#fff;color:var(--forest);border:1px solid var(--line2)}
.lb .gal .msg{color:var(--sage);text-align:center;padding:80px 20px;line-height:1.6}
.lb .gal .gsize{display:flex;gap:4px;background:rgba(238,243,241,.1);padding:4px;border-radius:999px;z-index:2}
.lb .gal .gsize button{border:0;background:none;color:var(--mist);padding:5px 11px;border-radius:999px;font-family:var(--mono);font-size:11px}
.lb .gal .gsize button.on{background:var(--mist);color:var(--forest)}
.lb .back{position:absolute;top:16px;left:16px;border:0;background:rgba(238,243,241,.15);color:var(--mist);padding:9px 15px;border-radius:999px;font-weight:600;font-size:13px;z-index:3}
.lb .back:hover{background:rgba(238,243,241,.28)}
.lb .count{position:absolute;bottom:88px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:11px;color:var(--sage)}
.lbtabs{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(238,243,241,.1);padding:4px;border-radius:999px;z-index:2}
.lbtabs button{border:0;background:none;color:var(--mist);padding:6px 13px;border-radius:999px;font-size:12px;font-weight:600}
.lbtabs button.on{background:var(--mist);color:var(--forest)}
.lbtabs button[disabled]{opacity:.35;cursor:default}
.qinfo{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13px;color:var(--stone);margin:-8px 0 16px}
.qinfo b{color:var(--forest)}.qinfo s{color:var(--brick)}
.qinfo button{border:0;background:none;color:var(--teal);font-weight:600;font-size:12.5px;padding:0;text-decoration:underline;text-underline-offset:3px}
.homebtn{border:0;background:rgba(238,243,241,.1);color:var(--mist);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;transition:.15s}
.homebtn:hover{background:var(--mist);color:var(--forest)}
.colbadge{position:absolute;left:12px;top:40px;font-size:11px;font-weight:700;background:var(--amber);color:var(--forest);padding:3px 9px;border-radius:6px;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bsearch{border:1px solid var(--line2);border-radius:999px;padding:8px 14px;min-width:220px;outline:none;background:#fff;font-size:13px}
.bsearch:focus{border-color:var(--teal)}
.bbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:-4px 0 18px}
.bviews{display:flex;background:var(--white);border:1px solid var(--line2);border-radius:12px;padding:3px;gap:2px}
.bviews button{border:0;background:none;padding:8px 13px;border-radius:9px;font-weight:600;font-size:12.5px;color:var(--stone);display:flex;gap:6px;align-items:center}
.bviews button.on{background:var(--forest);color:var(--mist)}
.bviews .n{font-family:var(--mono);font-size:10px;background:var(--amber);color:var(--forest);border-radius:999px;padding:0 6px}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tagchip{border:1px solid var(--line2);background:var(--white);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--timber)}
.tagchip.on{background:var(--timber);border-color:var(--timber);color:#fff}
.tagchip button{border:0;background:none;padding:0 0 0 4px;color:inherit;opacity:.6}
.tagin{border:1px dashed var(--line2);border-radius:999px;padding:5px 11px;font-size:12px;outline:none;background:transparent;min-width:120px}
.tagin:focus{border-color:var(--teal);background:#fff}
.cmpbtn{position:absolute;right:52px;top:10px;height:34px;padding:0 11px;border-radius:999px;border:0;background:rgba(255,255,255,.92);font-size:11.5px;font-weight:700;z-index:3;display:flex;gap:5px;align-items:center}
.cmpbtn.on{background:var(--forest);color:var(--mist)}
.ctags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.ctags span{font-size:10.5px;font-weight:600;color:var(--timber);background:#F4EDE6;border-radius:5px;padding:1px 7px}
/* compare */
.cmp{display:grid;gap:14px;align-items:start}
.cmp .col{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.cmp .im{aspect-ratio:4/3;max-height:320px;width:100%;background:var(--mist);position:relative;cursor:zoom-in}
.cmp .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp .im.dw{background:#fff}.cmp .im.dw img{object-fit:contain;padding:8px}
.cmp .im .lbl{position:absolute;left:8px;top:8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.92);padding:2px 7px;border-radius:5px;border:1px solid var(--line)}
.cmp .rw{padding:9px 14px;border-top:1px solid var(--line);font-size:13px;min-height:38px}
.cmp .rw span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--stone);margin-bottom:2px}
.cmp h3{font-family:var(--serif);font-weight:600;font-size:19px;margin:0;line-height:1.15}
.cmp .x{border:0;background:none;color:var(--stone);font-size:12px;padding:8px 14px;text-align:left;border-top:1px solid var(--line)}
.cmp .x:hover{color:var(--brick)}
/* matrix */
.mtx-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
table.mtx{border-collapse:collapse;width:100%;font-size:12.5px;min-width:1100px}
.mtx th{position:sticky;top:0;background:var(--mist);text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--stone);font-weight:500;padding:10px 10px;cursor:pointer;white-space:nowrap;border-bottom:1px solid var(--line)}
.mtx th:hover{color:var(--forest)}
.mtx td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.mtx tr:hover td{background:#FAFCFB}
.mtx td.th{width:84px}.mtx td.th img{width:76px;height:56px;object-fit:cover;border-radius:6px;display:block;cursor:zoom-in}
.mtx td b{font-family:var(--serif);font-weight:600;font-size:14px}
.mtx td.nt{max-width:260px;white-space:pre-wrap;color:var(--forest)}
.mtx a{color:var(--teal)}
/* map */
#map{height:min(68vh,640px);border-radius:14px;border:1px solid var(--line);overflow:hidden;background:var(--mist)}
.nomap{margin-top:16px}
.nomap .r{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.nomap .r input{flex:1;max-width:320px;border:1px solid var(--line2);border-radius:8px;padding:7px 10px;outline:none}
.leaflet-popup-content{font-family:var(--sans);margin:10px 12px}
.pop img{width:200px;height:130px;object-fit:cover;border-radius:6px;display:block;margin-bottom:6px}
.pop b{font-family:var(--serif);font-weight:600;font-size:15px;display:block}
.pop button{margin-top:6px;border:0;background:var(--forest);color:var(--mist);border-radius:7px;padding:5px 10px;font-weight:600;font-size:12px;cursor:pointer}
/* roulette */
.rou{background:linear-gradient(120deg,#fff,#FBF4E4);border:1px solid #EBD9B0;border-radius:14px;padding:12px 16px;margin-bottom:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rou b{font-family:var(--serif);font-weight:600;font-size:18px}
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block;color:#1D3A30;font-family:var(--sans)}
  .pp{page-break-after:always;padding:6mm 2mm}
  .pp h1{font-family:var(--serif);font-weight:600;font-size:26pt;margin:0 0 2mm}
  .pp h2{font-family:var(--serif);font-weight:600;font-size:17pt;margin:0}
  .pp .meta2{font-size:9.5pt;color:#6B7280;margin:1mm 0 3mm}
  .pp .imgs{display:grid;grid-template-columns:2fr 1fr;gap:3mm;height:120mm}
  .pp .imgs img{width:100%;height:100%;object-fit:cover;border-radius:2mm}
  .pp .imgs .side2{display:grid;grid-template-rows:1fr 1fr;gap:3mm;min-height:0}
  .pp .imgs .side2 img{object-fit:contain;background:#fff;border:0.3mm solid #D9E2DE}

const ADJ={swedish:"sweden",norwegian:"norway",danish:"denmark",finnish:"finland",icelandic:"iceland",german:"germany",french:"france",italian:"italy",spanish:"spain",portuguese:"portugal",dutch:"netherlands",swiss:"switzerland",austrian:"austria",japanese:"japan",chinese:"china",korean:"south-korea",mexican:"mexico",chilean:"chile",ukrainian:"ukraine",polish:"poland",british:"united-kingdom",english:"united-kingdom",american:"united-states",canadian:"canada",australian:"australia",dubai:"united-arab-emirates",uae:"united-arab-emirates",emirates:"united-arab-emirates","abu dhabi":"united-arab-emirates",usa:"united-states",uk:"united-kingdom",slovak:"slovakia"};

function smartParse(text){
  let t=" "+text.toLowerCase().replace(/[“”"]/g," ")+" ";const got={};const used=[];
  // area
  const toN=x=>{x=x.replace(/,/g,"");let n=parseFloat(x);if(/k$/.test(x))n*=1000;return n};
  let m=t.match(/(\d[\d.,]*k?)\s*(?:-|–|to)\s*(\d[\d.,]*k?)\s*(m2|m²|sqm|square ?met(?:er|re)s?)/);
  if(m){got.amin=Math.round(toN(m[1]));got.amax=Math.round(toN(m[2]));used.push(m[0])}
  else if((m=t.match(/(\d[\d.,]*k?)\s*(m2|m²|sqm|square ?met(?:er|re)s?)/))){const n=toN(m[1]);got.amin=Math.round(n*0.6);got.amax=Math.round(n*1.5);used.push(m[0])}
  // year
  if((m=t.match(/\b(19[5-9]\d|20[0-2]\d)\b/))){got.year=m[1];used.push(m[0])}
  // function
  for(const [re,slug] of FN_WORDS){const x=t.match(re);if(x){got.cat=slug;used.push(x[0]);break}}
  // material
  for(const [re,mat] of MAT_WORDS){const x=t.match(re);if(x){got.mat=mat;used.push(x[0]);break}}
  // country
  const cl=(S.countries.length?S.countries:FALLBACK_COUNTRIES);
  for(const c of cl){const n=c.n.toLowerCase();if(n.length>3&&t.includes(" "+n)){got.country=c.s;used.push(n);break}}
  if(!got.country)for(const [w,slug] of Object.entries(ADJ)){if(new RegExp("\\b"+w+"\\b").test(t)&&cl.some(c=>c.s===slug)){got.country=slug;used.push(w);break}}
  // remaining descriptive words → keywords
  let rest=t;used.forEach(u=>rest=rest.replace(u," "));
  const words=rest.replace(/[^a-zà-ž0-9\- ]/gi," ").split(/\s+/).filter(w=>w&&!STOP.has(w)&&!/^\d+$/.test(w));
  got.q=[...new Set(words)].slice(0,4).join(" ");
  return got;
}
function smartSearch(text){

}

/* ===================== drawings ===================== */
const IMG_API="https://www.archdaily.com/search/api/v1/us/images";
const DRAW_FILE=/plan|section|elevat|drawing|diagram|axo|isometr|site[-_]?plan|sketch|layout|grundriss|planta|schnitt|corte|dwg|dessin|drw|floor[-_]?\d|level[-_]?\d/i;
const DRAW_SHORT=/\b(plans?|sections?|elevations?|drawings?|diagrams?|axonometric|isometric|sketch(es)?|masterplan|site|level \d|floor)\b/i;
const DRAW_LONG=/\b(floor ?plans?|site ?plans?|ground floor plan|roof plan|architectural (plans?|drawings?)|cross[- ]sections?|longitudinal sections?|section drawings?|elevation drawings?|(north|south|east|west|front|rear|side) elevations?|axonometric|exploded (axo|view)|diagrams?|plans? (of|for) the)\b/i;
const NOT_DRAW=/open[- ]plan|photograph|photo by/i;
function isDrawing(file,text,nameWords){
  let f=file.replace(/\.(jpe?g|png|webp)(\?.*)?$/i,"").toLowerCase();
  (nameWords||[]).forEach(w=>{if(w.length>1)f=f.split(w).join(" ")});
  if(DRAW_FILE.test(f)&&!/open-?plan/i.test(f))return true;
  text=(text||"").trim();if(!text||NOT_DRAW.test(text))return false;
  return text.length<=60?DRAW_SHORT.test(text):DRAW_LONG.test(text);
}
const DET_RE=/\b(details?|detailing|detalles?|détails?|detalhes?|detail[- ]?section|construction (detail|section)|constructive (detail|section)|wall section|facade section|façade section|roof (detail|edge)|eaves|parapet|connections?|junctions?|joints?|joinery|fixing|anchor(age)?|node|sill|lintel|foundation detail|1:5\b|1:10\b|1:20\b)\b/i;
const DET_FILE=/detail|detalle|detalhe|junction|connection|joint|1-5\b|1-10\b|1-20\b|_det[_-]|-det-/i;
function isDetail(file,text,nameWords){
  let f=String(file||"").toLowerCase();(nameWords||[]).forEach(w=>{if(w.length>2)f=f.split(w).join(" ")});
  if(DET_FILE.test(f))return true;
  return DET_RE.test(String(text||""));
}
const queue=[];let active=0;
function loadDrawings(id){
  const p=findItem(id);if(!p||p.drState)return Promise.resolve();
  p.drState="loading";p.dr=p.dr||[];refreshCard(id);
  return new Promise(res=>{queue.push(async()=>{try{await fetchDrawings(p)}catch(e){}p.drState="done";refreshCard(id);if(LBid===id)openLB(id,LBtab,null,true);if(S.view==="board"&&S.bview==="compare"&&S.cmp.includes(id)&&!$("#lb").classList.contains("on"))renderBoard();res()});pump()});
}
function pump(){while(active<4&&queue.length){active++;const f=queue.shift();f().finally(()=>{active--;pump()})}}
function adImg(i,p){
  const sz=i.sizes||{};const cap=String(i.caption||i.alt||"").replace(p&&p.name?p.name:"@@","").replace(/ - Drawings?.*$/i,"").trim();
  const nameWords=p?(p.name+" "+(p.by||"")).toLowerCase().split(/[^a-z0-9]+/).filter(Boolean):[];
  return {m:sz.medium||sz.large,l:sz.large||sz.slideshow||sz.medium,s:sz.medium||sz.large,cap:cap.slice(0,80),det:isDetail((sz.large||"").split("/").pop(),cap,nameWords)};
}
async function fetchDrawings(p){
  if(p.src==="archdaily"){
    if(!p.office)return;
    const cty=(S.countries.length?S.countries:FALLBACK_COUNTRIES).find(c=>c.n.toLowerCase()===String(p.country||"").toLowerCase());
    const paths=[`/offices/${p.office}/image_type/drawings`];if(cty)paths.push(`/offices/${p.office}/country/${cty.s}/image_type/drawings`);
    for(const path of paths){
      const j=await (await getJSON(IMG_API+path)).json();
      const g=(j.results||[]).find(z=>z.parent_info&&String(z.parent_info.id)===p.adid);
      if(g){p.dr=g.images.map(i=>adImg(i,p)).filter(x=>x.l);p.det=p.dr.filter(x=>x.det);p.drTotal=g.total_images;return}
      if((j.results||[]).length<10)break;
    }
    return;
  }
  await enrichGallery(p);
}

function allCols(){const m={};Object.values(S.board).forEach(b=>{const c=(b.col||"").trim()||"Unsorted";m[c]=(m[c]||0)+1});return Object.entries(m).sort((a,b)=>a[0]==="Unsorted"?1:b[0]==="Unsorted"?-1:a[0].localeCompare(b[0]))}

async function geocode(q){

async function enrichGallery(p){
  if(p.full||p.src==="archdaily"||!p.wpid)return;p.full=true;
  const s=SRC[p.src];
  try{
    const j=await (await getJSON(`https://${s.host}/wp-json/wp/v2/posts/${p.wpid}?_fields=content`)).json();
    const html=j&&j.content&&j.content.rendered||"";
    const doc=new DOMParser().parseFromString(html,"text/html");
    const urls=[];
    const nameWords=(p.name+" "+(p.by||"")).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").split(/[^a-z0-9]+/).filter(Boolean);
    doc.querySelectorAll("img").forEach(im=>{
      let u=im.getAttribute("data-src")||im.getAttribute("data-lazy-src")||im.getAttribute("src")||"";
      const ss=im.getAttribute("srcset")||im.getAttribute("data-srcset");
      if(ss){const c=ss.split(",").map(x=>x.trim().split(/\s+/)).filter(x=>x[0]);const big=c.sort((a,b)=>parseInt(b[1]||0)-parseInt(a[1]||0))[0];if(big)u=big[0]}
      if(!u||u.startsWith("data:")||/\.(svg|gif)(\?|$)/i.test(u)||/avatar|logo|icon|emoji|pixel|banner|advert/i.test(u))return;
      if(u.startsWith("//"))u="https:"+u;
      const w=+im.getAttribute("width")||999;if(w<300)return;
      const txt=[im.getAttribute("alt")||"",im.getAttribute("title")||"",(im.closest("figure")&&im.closest("figure").querySelector("figcaption")||{}).textContent||""].join(" ").slice(0,200);
      const det=isDetail(u.split("/").pop(),txt,nameWords);
      if(!urls.some(x=>x.u===u))urls.push({u,dw:det||isDrawing(u.split("/").pop(),txt,nameWords),det,cap:(im.getAttribute("alt")||"").slice(0,80)});
    });
    p.dr=p.dr||[];
    urls.slice(0,40).forEach(({u,dw,det,cap})=>{if(dw){if(!p.dr.some(x=>x.l===u))p.dr.push({m:u,l:u,s:u,det,cap})}else if(!p.imgs.some(x=>x.l===u))p.imgs.push({m:u,l:u,s:u,cap})});
    p.det=p.dr.filter(x=>x.det);
  }catch(e){}
}

  const gal=$("#lbgal");if(gal&&keep&&openLB._st!=null&&openLB._id===id)gal.scrollTop=openLB._st;
  if(gal)gal.onscroll=()=>{openLB._st=gal.scrollTop;openLB._id=id};else{openLB._st=null}
  $("#lbx").onclick=closeLB;
  lb.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{if(b.disabled)return;LBi=0;openLB(id,b.dataset.tab,null,true)});
  lb.querySelectorAll("#lbgal .gi").forEach(g=>{g.onclick=()=>{LBi=+g.dataset.k;LBview="single";openLB(id,LBtab,null,true)};const im=g.querySelector("img");im.onerror=()=>g.remove()});
  lb.querySelectorAll("[data-gc]").forEach(b=>b.onclick=()=>{LBcols=+b.dataset.gc;const c=lb.querySelector(".cols");if(c)c.style.setProperty("--gc",LBcols);lb.querySelectorAll("[data-gc]").forEach(x=>x.classList.toggle("on",x===b))});
  const bk=$("#lbback");if(bk)bk.onclick=()=>{LBview="grid";openLB(id,LBtab,null,true)};
  const go=d=>{if(LBview!=="single"||!L.length)return;LBi=(LBi+d+L.length)%L.length;const im=$("#lbimg");im.src=L[LBi].l;im.classList.toggle("dw",!!L[LBi].dw);lb.querySelectorAll(".strip img").forEach((x,k)=>x.classList.toggle("on",k===LBi));const c=lb.querySelector(".count");if(c)c.textContent=(LBi+1)+" / "+L.length};
  LBgo=go;
  const pv=$("#lbp"),nx=$("#lbn");if(pv)pv.onclick=()=>go(-1);if(nx)nx.onclick=()=>go(1);
  lb.querySelectorAll(".strip img").forEach(im=>{im.onclick=()=>{LBi=+im.dataset.k;go(0)};im.onerror=()=>im.remove()});
  $("#lbsave").onclick=()=>toggleSave(id);
  const nt=$("#lbnote"),cl=$("#lbcol");
  if(nt)nt.oninput=()=>{S.board[id].note=nt.value;persist()};
  if(cl){cl.oninput=()=>{S.board[id].col=cl.value;persist()};cl.onchange=()=>refreshCard(id)}
  const lc=$("#lbloc");if(lc)lc.oninput=()=>{S.board[id].loc=lc.value;persist()};
  const cm=$("#lbcmp");if(cm)cm.onclick=()=>toggleCmp(id);
}
function closeLB(){LBview="grid";openLB._st=null;$("#lb").classList.remove("on");LBid=null;if(S.view==="board")renderBoard()}
document.addEventListener("keydown",e=>{if(!$("#lb").classList.contains("on"))return;if(e.target.matches("textarea,input")&&e.key!=="Escape")return;if(e.target.matches("textarea,input"))e.target.blur();if(e.key==="Escape"){if(LBview==="single"&&LBid){LBview="grid";openLB(LBid,LBtab,null,true)}else closeLB()}if(e.key==="ArrowRight")LBgo(1);if(e.key==="ArrowLeft")LBgo(-1)});

let tt;function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("on"),1700)}

/* ===================== wiring ===================== */
function setMode(m){
  S.mode=m;document.querySelectorAll("#mode button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
  $("#q").placeholder=m==="smart"?"Describe it — e.g. 300 m² timber community hall in Sweden (press Enter)":"Search projects — e.g. timber library, dome, rammed earth…";
  $("#q").focus();
}
document.querySelectorAll("#mode button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
$("#rouBtn").onclick=spin;
function goHome(){
  closeLB();Object.assign(S,{view:"results",q:"",cat:"",country:"",mat:"",year:"",amin:"",amax:"",bucket:null,smart:null,roulette:null,kind:"projects"});
  $("#q").value="";$("#boardBtn").classList.remove("on");setMode("search");persist();window.scrollTo(0,0);search();
}
$("#homeBtn").onclick=goHome;$("#brandHome").onclick=goHome;
$("#boardBtn").onclick=()=>{S.view=S.view==="board"?"results":"board";$("#boardBtn").classList.toggle("on",S.view==="board");renderSide();renderMain()};
let qt;
$("#q").addEventListener("input",e=>{if(S.mode==="smart")return;clearTimeout(qt);qt=setTimeout(()=>{S.q=e.target.value.trim();S.smart=null;S.exact=false;if(S.view==="board"){S.view="results";$("#boardBtn").classList.remove("on");renderSide()}search()},450)});
$("#q").addEventListener("keydown",e=>{if(e.key!=="Enter")return;clearTimeout(qt);if(S.view==="board"){S.view="results";$("#boardBtn").classList.remove("on");renderSide()}
  S.exact=false;if(S.mode==="smart")smartSearch(e.target.value);else{S.q=e.target.value.trim();S.smart=null;search()}});
setMode("search");renderSide();search();
</script>
